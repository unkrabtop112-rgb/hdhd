                  long lt = d.getLong("loadTime", 0), lh = d.getLong("lastHit", 0);
                  StringBuilder s = new StringBuilder();
                  if (lt == 0) {
                      s.append("• SystemUI ещё не загружал модуль (проверь область действия в LSPosed и перезапусти SystemUI)\n");
                  } else {
                      s.append("• SystemUI загрузил модуль в ").append(f.format(new java.util.Date(lt))).append("\n");
                      s.append("• ").append(d.getString("status", "")).append("\n");
                  }
                  if (lh == 0) {
                      s.append("• Кнопки клавиатуры ещё ни разу не запрашивали стиль (открой ввод PIN на экране блокировки)");
                  } else {
