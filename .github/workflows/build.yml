          package com.pinskin.lsp;

          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.ViewParent;
          import android.view.animation.DecelerateInterpolator;
          import android.view.animation.OvershootInterpolator;

          import java.util.ArrayList;
          import java.util.List;
          import java.util.Map;
          import java.util.WeakHashMap;

          /**
           * Анимация нажатия кнопки: запускается самим касанием, а не состоянием «pressed» (оно приходит с задержкой).
           * На время нажатия снимается обрезка у всех родителей кнопки, иначе выросшую кнопку срезает контейнер.
           */
          public final class PressAnim {
              private PressAnim() {}

              private static final long MIN_HOLD_MS = 80;
              private static final WeakHashMap<View, Long> DOWN = new WeakHashMap<>();

              private static final class Saved { boolean children, padding, outline; }
              private static final WeakHashMap<ViewGroup, Saved> SAVED = new WeakHashMap<>();
              private static final Handler H = new Handler(Looper.getMainLooper());
              private static int active;
              private static final Runnable RESTORE = new Runnable() {
                  @Override public void run() {
                      if (active > 0) return;
                      List<Map.Entry<ViewGroup, Saved>> all = new ArrayList<>(SAVED.entrySet());
                      for (Map.Entry<ViewGroup, Saved> e : all) {
                          ViewGroup g = e.getKey();
                          Saved s = e.getValue();
                          if (g == null || s == null) continue;
                          g.setClipChildren(s.children);
                          g.setClipToPadding(s.padding);
                          g.setClipToOutline(s.outline);
                      }
                      SAVED.clear();
                  }
              };

              /** Снимает обрезку у всех предков кнопки (запоминая прежнее состояние). */
              private static void unclip(View key) {
                  View cur = key;
                  for (int i = 0; i < 20; i++) {
                      ViewParent p = cur.getParent();
                      if (!(p instanceof ViewGroup)) break;
                      ViewGroup g = (ViewGroup) p;
                      if (!SAVED.containsKey(g)) {
                          Saved s = new Saved();
                          s.children = g.getClipChildren();
                          s.padding = g.getClipToPadding();
                          s.outline = g.getClipToOutline();
                          SAVED.put(g, s);
                      }
                      g.setClipChildren(false);
                      g.setClipToPadding(false);
                      g.setClipToOutline(false);
                      cur = g;
                  }
              }

              public static void onTouch(View key, MotionEvent e, Cfg c) {
                  if (c == null || !c.enabled || !c.pressAnim) return;
                  int a = e.getActionMasked();
                  float small = c.small ? 0.8f : 1f;
                  float bx = c.stretchX / 100f * small;
                  float by = c.stretchY / 100f * small;
                  if (a == MotionEvent.ACTION_DOWN) {
                      active++;
                      H.removeCallbacks(RESTORE);
                      unclip(key);
                      H.postDelayed(RESTORE, 5000L);   // страховка, если UP почему-то не придёт
                      DOWN.put(key, SystemClock.uptimeMillis());
                      float pk = 1f + Math.max(4, Math.min(30, c.pressPop)) / 100f;
                      key.animate().cancel();
                      key.animate().setStartDelay(0).scaleX(bx * pk).scaleY(by * pk)
                              .setDuration(80).setInterpolator(new DecelerateInterpolator()).start();
                  } else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) {
                      Long t0 = DOWN.remove(key);
                      long held = t0 == null ? MIN_HOLD_MS : SystemClock.uptimeMillis() - t0;
                      long delay = Math.max(0L, MIN_HOLD_MS - held);
                      key.animate().setStartDelay(delay).scaleX(bx).scaleY(by)
                              .setDuration(260).setInterpolator(new OvershootInterpolator(2.5f)).start();
                      if (active > 0) active--;
                      H.removeCallbacks(RESTORE);
                      H.postDelayed(RESTORE, delay + 260L + 200L);   // вернуть обрезку после возврата кнопки
                  }
              }
          }
