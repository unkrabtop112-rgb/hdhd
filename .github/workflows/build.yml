name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Create project files and build
        run: |
          mkdir -p 'app'
          cat > 'app/build.gradle' <<'PINSKIN_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.pinskin.lsp'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.pinskin.lsp'
                  minSdk 26
                  targetSdk 33
                  versionCode 12
                  versionName '1.11'
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              compileOnly 'de.robv.android.xposed:api:82'
          }
          PINSKIN_EOF
          mkdir -p 'app/src/main'
          cat > 'app/src/main/AndroidManifest.xml' <<'PINSKIN_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:allowBackup="false">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name=".ConfigProvider"
                      android:authorities="com.pinskin.lsp.config"
                      android:exported="true"
                      android:directBootAware="true" />

                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="@string/xposed_desc" />
                  <meta-data android:name="xposedminversion" android:value="82" />
                  <meta-data android:name="xposedscope" android:resource="@array/xposed_scope" />
              </application>
          </manifest>
          PINSKIN_EOF
          mkdir -p 'app/src/main/assets'
          cat > 'app/src/main/assets/xposed_init' <<'PINSKIN_EOF'
          com.pinskin.lsp.Hook
          PINSKIN_EOF
          mkdir -p 'app/src/main/java/com/pinskin/lsp'
          cat > 'app/src/main/java/com/pinskin/lsp/AuroraView.java' <<'PINSKIN_EOF'
          package com.pinskin.lsp;

          import android.animation.ValueAnimator;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.graphics.RadialGradient;
          import android.graphics.Shader;
          import android.view.View;
          import android.view.animation.LinearInterpolator;

          /** Медленно плывущие цветные пятна на тёмном фоне: то, что «просвечивает» сквозь стекло. */
          public final class AuroraView extends View {
              // cx, cy, radius (доля от большей стороны), цвет, скорость (целое: цикл замкнут), фаза
              private static final float[][] BLOBS = {
                      {0.15f, 0.10f, 0.75f, 0, 1, 0.0f},
                      {0.90f, 0.45f, 0.80f, 1, 1, 2.1f},
                      {0.20f, 0.88f, 0.85f, 2, 2, 4.0f},
              };
              private static final int[] COLORS = {0xFFE0103A, 0xFF8A0F35, 0xFF3A1FA8};

              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Shader[] shaders = new Shader[BLOBS.length];
              private final Matrix m = new Matrix();
              private final ValueAnimator anim = ValueAnimator.ofFloat(0f, (float) (2 * Math.PI));
              private float t;

              public AuroraView(Context c) {
                  super(c);
                  for (int i = 0; i < BLOBS.length; i++) {
                      int col = COLORS[(int) BLOBS[i][3]];
                      shaders[i] = new RadialGradient(0, 0, 1000f,
                              new int[]{(col & 0x00FFFFFF) | 0x8C000000, (col & 0x00FFFFFF) | 0x33000000, col & 0x00FFFFFF},
                              new float[]{0f, 0.5f, 1f}, Shader.TileMode.CLAMP);
                  }
                  anim.setDuration(26000);
                  anim.setRepeatCount(ValueAnimator.INFINITE);
                  anim.setInterpolator(new LinearInterpolator());
                  anim.addUpdateListener(a -> { t = (float) a.getAnimatedValue(); invalidate(); });
              }

              @Override protected void onAttachedToWindow() { super.onAttachedToWindow(); anim.start(); }
              @Override protected void onDetachedFromWindow() { anim.cancel(); super.onDetachedFromWindow(); }

              @Override
              protected void onDraw(Canvas c) {
                  c.drawColor(0xFF07070B);
                  float w = getWidth(), h = getHeight(), big = Math.max(w, h);
                  for (int i = 0; i < BLOBS.length; i++) {
                      float[] b = BLOBS[i];
                      float x = w * (b[0] + 0.14f * (float) Math.sin(t * b[4] + b[5]));
                      float y = h * (b[1] + 0.09f * (float) Math.cos(t * b[4] + b[5]));
                      float rad = big * b[2] * 0.62f;
                      m.setScale(rad / 1000f, rad / 1000f);
                      m.postTranslate(x, y);
                      shaders[i].setLocalMatrix(m);
                      p.setShader(shaders[i]);
                      c.drawCircle(x, y, rad, p);
                  }
              }
          }
          PINSKIN_EOF
          mkdir -p 'app/src/main/java/com/pinskin/lsp'
          cat > 'app/src/main/java/com/pinskin/lsp/Cfg.java' <<'PINSKIN_EOF'
          package com.pinskin.lsp;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.os.Bundle;

          /** Настройки модуля. Без зависимостей от Xposed: используется и приложением, и хуком. */
          public final class Cfg {
              public static final String MODULE_PKG = "com.pinskin.lsp";
              public static final String PREFS = "pinskin_prefs";

              public static final String K_ENABLED = "enabled";
              public static final String K_SHAPE = "shape";          // 0 круг, 1 скруглённый, 2 квадрат
              public static final String K_BG = "bgColor";           // ARGB
              public static final String K_TEXT = "textColor";       // ARGB
              public static final String K_TEXT_SCALE = "textScale"; // 50..200 %
              public static final String K_OPACITY = "opacity";      // 10..100 %
              public static final String K_SX = "stretchX";          // 50..200 %
              public static final String K_SY = "stretchY";          // 50..200 %
              public static final String K_SMALL = "small";
              public static final String K_NOCLIP = "noClip";
              public static final String K_HIDE = "hideLetters";
              public static final String K_USE_IMG = "useImage";
              public static final String K_IMG = "imageB64";

              public static final String K_OV_ENABLED = "ovEnabled";
              public static final String K_OV_IMG = "ovB64";
              public static final String K_OV_SIZE = "ovSize";   // 5..150 % ширины блока цифр
              public static final String K_OV_ROT = "ovRot";     // -180..180 градусов
              public static final String K_OV_X = "ovX";         // 0..1000 (тысячные доли ширины блока цифр)
              public static final String K_OV_Y = "ovY";         // 0..1000 (тысячные доли высоты блока цифр)

              public static final String K_HIDE_DIGITS = "hideDigits";
              public static final String K_CUSTOM_LBL = "customLabels";
              public static final String K_KEY_GAP = "keyGap";       // 0..40 % зазор внутри клетки кнопки
              public static final String K_PRESS_ANIM = "pressAnim";
              public static final String K_PRESS_POP = "pressPop";   // 4..30 % на сколько кнопка вырастает при нажатии
              public static final String K_KEYIMG_ON = "keyImgOn";
              public static final String K_KEYIMG = "kimg";      // kimg0..kimg9: своя картинка на кнопке цифры
              public static final String K_LBL = "lbl";          // lbl0..lbl9: своя надпись вместо цифры (до 2 знаков)

              public boolean enabled, small, noClip, hideLetters, useImage;
              public int shape, bgColor, textColor, textScale, opacity, stretchX, stretchY;
              public String imageB64;
              public boolean ovEnabled;
              public int ovSize, ovRot, ovX, ovY;
              public String ovImage;
              public boolean hideDigits, customLabels;
              public final String[] labels = new String[10];
              public boolean keyImgOn;
              public boolean pressAnim;
              public int keyGap;
              public int pressPop;
              public final String[] keyImages = new String[10];

              interface Source {
                  boolean b(String k, boolean d);
                  int i(String k, int d);
                  String s(String k, String d);
              }

              public static Cfg from(final SharedPreferences sp) {
                  return from(new Source() {
                      public boolean b(String k, boolean d) { return sp.getBoolean(k, d); }
                      public int i(String k, int d) { return sp.getInt(k, d); }
                      public String s(String k, String d) { return sp.getString(k, d); }
                  });
              }

              public static Cfg from(final Bundle bd) {
                  return from(new Source() {
                      public boolean b(String k, boolean d) { return bd.getBoolean(k, d); }
                      public int i(String k, int d) { return bd.getInt(k, d); }
                      public String s(String k, String d) {
                          String v = bd.getString(k);
                          if (v != null) return v;
                          byte[] raw = bd.getByteArray(k);   // картинки провайдер отдаёт байтами: так легче для Binder
                          return raw != null ? android.util.Base64.encodeToString(raw, android.util.Base64.NO_WRAP) : d;
                      }
                  });
              }

              private static Cfg from(Source sp) {
                  Cfg c = new Cfg();
                  c.enabled = sp.b(K_ENABLED, true);
                  c.shape = sp.i(K_SHAPE, 0);
                  c.bgColor = sp.i(K_BG, 0xFF3A3A3C);
                  c.textColor = sp.i(K_TEXT, 0xFFFFFFFF);
                  c.textScale = sp.i(K_TEXT_SCALE, 100);
                  c.opacity = sp.i(K_OPACITY, 100);
                  c.stretchX = sp.i(K_SX, 100);
                  c.stretchY = sp.i(K_SY, 100);
                  c.small = sp.b(K_SMALL, false);
                  c.noClip = sp.b(K_NOCLIP, false);
                  c.hideLetters = sp.b(K_HIDE, false);
                  c.useImage = sp.b(K_USE_IMG, false);
                  c.imageB64 = sp.s(K_IMG, "");
                  c.ovEnabled = sp.b(K_OV_ENABLED, false);
                  c.ovSize = sp.i(K_OV_SIZE, 60);
                  c.ovRot = sp.i(K_OV_ROT, 0);
                  c.ovX = sp.i(K_OV_X, 500);
                  c.ovY = sp.i(K_OV_Y, 500);
                  c.ovImage = sp.s(K_OV_IMG, "");
                  c.hideDigits = sp.b(K_HIDE_DIGITS, false);
                  c.customLabels = sp.b(K_CUSTOM_LBL, false);
                  for (int i = 0; i < 10; i++) c.labels[i] = sp.s(K_LBL + i, "");
                  c.keyImgOn = sp.b(K_KEYIMG_ON, true);
                  c.pressAnim = sp.b(K_PRESS_ANIM, false);
                  c.keyGap = sp.i(K_KEY_GAP, 12);
                  c.pressPop = sp.i(K_PRESS_POP, 12);
                  for (int i = 0; i < 10; i++) c.keyImages[i] = sp.s(K_KEYIMG + i, "");
                  return c;
              }

              /** Настройки в device-protected хранилище: доступны и до первой разблокировки после загрузки. */
              public static SharedPreferences open(Context ctx) {
                  return ctx.createDeviceProtectedStorageContext().getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }

              public static SharedPreferences diag(Context ctx) {
                  return ctx.createDeviceProtectedStorageContext().getSharedPreferences("pinskin_diag", Context.MODE_PRIVATE);
              }
          }
          PINSKIN_EOF
          mkdir -p 'app/src/main/java/com/pinskin/lsp'
          cat > 'app/src/main/java/com/pinskin/lsp/ColorPickerView.java' <<'PINSKIN_EOF'
          package com.pinskin.lsp;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.view.MotionEvent;
          import android.view.View;

          /** Палитра: квадрат насыщенность/яркость, полоса оттенка и полоса прозрачности. */
          public final class ColorPickerView extends View {
              public interface Listener { void onColor(int argb); }

              private final float[] hsv = {0f, 1f, 1f};
              private int alpha = 255;
              private Listener listener;
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF svR = new RectF(), hueR = new RectF(), alR = new RectF();
              private final Path clip = new Path();
              private final float d;
              private int region = -1;

              public ColorPickerView(Context c) {
                  super(c);
                  d = c.getResources().getDisplayMetrics().density;
              }

              public void setListener(Listener l) { listener = l; }

              public void setColor(int argb) {
                  Color.colorToHSV(argb, hsv);
                  alpha = Color.alpha(argb);
                  invalidate();
              }

              public int getColor() { return Color.HSVToColor(alpha, hsv); }

              @Override
              protected void onMeasure(int wSpec, int hSpec) {
                  int w = MeasureSpec.getSize(wSpec);
                  int svH = (int) (w * 0.62f);
                  int bar = (int) (28 * d), gap = (int) (14 * d);
                  setMeasuredDimension(w, svH + gap + bar + gap + bar);
              }

              @Override
              protected void onSizeChanged(int w, int h, int ow, int oh) {
                  float svH = w * 0.62f, bar = 28 * d, gap = 14 * d;
                  svR.set(0, 0, w, svH);
                  hueR.set(0, svH + gap, w, svH + gap + bar);
                  alR.set(0, hueR.bottom + gap, w, hueR.bottom + gap + bar);
              }

              private void clipRound(Canvas c, RectF r, float rad) {
                  clip.reset();
                  clip.addRoundRect(r, rad, rad, Path.Direction.CW);
                  c.clipPath(clip);
              }

              private void thumb(Canvas c, float x, RectF bar, int fill) {
                  float r = bar.height() / 2f - 2 * d;
                  float cx = Math.max(bar.left + r + 2 * d, Math.min(bar.right - r - 2 * d, x));
                  float cy = bar.centerY();
                  p.setShader(null);
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(fill);
                  c.drawCircle(cx, cy, r, p);
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(3 * d);
                  p.setColor(0xFFFFFFFF);
                  c.drawCircle(cx, cy, r, p);
                  p.setStrokeWidth(1 * d);
                  p.setColor(0x66000000);
                  c.drawCircle(cx, cy, r + 1.5f * d, p);
                  p.setStyle(Paint.Style.FILL);
              }

              @Override
              protected void onDraw(Canvas c) {
                  int pure = Color.HSVToColor(new float[]{hsv[0], 1f, 1f});
                  int opaque = Color.HSVToColor(255, hsv);

                  // насыщенность / яркость
                  c.save();
                  clipRound(c, svR, 14 * d);
                  p.setStyle(Paint.Style.FILL);
                  p.setShader(new LinearGradient(svR.left, 0, svR.right, 0, 0xFFFFFFFF, pure, Shader.TileMode.CLAMP));
                  c.drawRect(svR, p);
                  p.setShader(new LinearGradient(0, svR.top, 0, svR.bottom, 0x00000000, 0xFF000000, Shader.TileMode.CLAMP));
                  c.drawRect(svR, p);
                  p.setShader(null);
                  c.restore();
                  float ix = svR.left + hsv[1] * svR.width(), iy = svR.top + (1f - hsv[2]) * svR.height();
                  p.setStyle(Paint.Style.FILL);
                  p.setColor(opaque);
                  c.drawCircle(ix, iy, 11 * d, p);
                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(3 * d);
                  p.setColor(0xFFFFFFFF);
                  c.drawCircle(ix, iy, 11 * d, p);
                  p.setStrokeWidth(1 * d);
                  p.setColor(0x66000000);
                  c.drawCircle(ix, iy, 12.5f * d, p);
                  p.setStyle(Paint.Style.FILL);

                  // оттенок
                  c.save();
                  clipRound(c, hueR, hueR.height() / 2f);
                  p.setShader(new LinearGradient(hueR.left, 0, hueR.right, 0,
                          new int[]{0xFFFF0000, 0xFFFFFF00, 0xFF00FF00, 0xFF00FFFF, 0xFF0000FF, 0xFFFF00FF, 0xFFFF0000},
                          null, Shader.TileMode.CLAMP));
                  c.drawRect(hueR, p);
                  p.setShader(null);
                  c.restore();
                  thumb(c, hueR.left + hsv[0] / 360f * hueR.width(), hueR, pure);

                  // прозрачность
                  c.save();
                  clipRound(c, alR, alR.height() / 2f);
                  float sq = 8 * d;
                  int row = 0;
                  for (float y = alR.top; y < alR.bottom; y += sq, row++) {
                      int col = 0;
                      for (float x = alR.left; x < alR.right; x += sq, col++) {
                          p.setColor(((row + col) & 1) == 0 ? 0xFFCCCCCC : 0xFF888888);
                          c.drawRect(x, y, x + sq, y + sq, p);
                      }
                  }
                  int rgb = opaque & 0x00FFFFFF;
                  p.setShader(new LinearGradient(alR.left, 0, alR.right, 0, rgb, rgb | 0xFF000000, Shader.TileMode.CLAMP));
                  c.drawRect(alR, p);
                  p.setShader(null);
                  c.restore();
                  thumb(c, alR.left + alpha / 255f * alR.width(), alR, getColor());
              }

              private static float cl(float v) { return Math.max(0f, Math.min(1f, v)); }

              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  float x = e.getX(), y = e.getY();
                  switch (e.getActionMasked()) {
                      case MotionEvent.ACTION_DOWN:
                          if (getParent() != null) getParent().requestDisallowInterceptTouchEvent(true);
                          if (svR.contains(x, y)) region = 0;
                          else if (y >= hueR.top - 6 * d && y <= hueR.bottom + 6 * d) region = 1;
                          else if (y >= alR.top - 6 * d && y <= alR.bottom + 6 * d) region = 2;
                          else region = -1;
                          update(x, y);
                          return true;
                      case MotionEvent.ACTION_MOVE:
                          update(x, y);
                          return true;
                      case MotionEvent.ACTION_UP:
                      case MotionEvent.ACTION_CANCEL:
                          region = -1;
                          return true;
                  }
                  return super.onTouchEvent(e);
              }

              private void update(float x, float y) {
                  if (region == 0) {
                      hsv[1] = cl((x - svR.left) / svR.width());
                      hsv[2] = 1f - cl((y - svR.top) / svR.height());
                  } else if (region == 1) {
                      hsv[0] = Math.min(359.9f, cl((x - hueR.left) / hueR.width()) * 360f);
                  } else if (region == 2) {
                      alpha = Math.round(cl((x - alR.left) / alR.width()) * 255f);
                  } else {
                      return;
                  }
                  invalidate();
                  if (listener != null) listener.onColor(getColor());
              }
          }
          PINSKIN_EOF
          mkdir -p 'app/src/main/java/com/pinskin/lsp'
          cat > 'app/src/main/java/com/pinskin/lsp/ConfigProvider.java' <<'PINSKIN_EOF'
          package com.pinskin.lsp;

          import android.content.ContentProvider;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.util.Base64;

          import java.util.Map;

          /** SystemUI обращается сюда через ContentResolver.call(): отдаём настройки и пишем диагностику. */
          public class ConfigProvider extends ContentProvider {
              @Override public boolean onCreate() { return true; }

              @Override
              public Bundle call(String method, String arg, Bundle extras) {
                  Context ctx = getContext();
                  if (ctx == null || method == null) return null;
                  Bundle out = new Bundle();
                  SharedPreferences diag = Cfg.diag(ctx);
                  if (method.equals("cfg")) {
                      for (Map.Entry<String, ?> e : Cfg.open(ctx).getAll().entrySet()) {
                          Object v = e.getValue();
                          if (v instanceof Boolean) out.putBoolean(e.getKey(), (Boolean) v);
                          else if (v instanceof Integer) out.putInt(e.getKey(), (Integer) v);
                          else if (v instanceof String) {
                              String key = e.getKey();
                              if (key.equals(Cfg.K_IMG) || key.equals(Cfg.K_OV_IMG) || key.startsWith(Cfg.K_KEYIMG)) {
                                  try { out.putByteArray(key, Base64.decode((String) v, Base64.NO_WRAP)); }
                                  catch (IllegalArgumentException ignored) { }
                              } else {
                                  out.putString(key, (String) v);
                              }
                          }
                      }
                      diag.edit().putLong("lastHit", System.currentTimeMillis())
                              .putInt("hits", diag.getInt("hits", 0) + 1).apply();
                  } else if (method.equals("ov")) {
                      diag.edit().putString("ov", arg == null ? "" : arg).apply();
                  } else if (method.equals("dump")) {
                      diag.edit().putString("dump", arg == null ? "" : arg).putLong("dumpTime", System.currentTimeMillis()).apply();
                  } else if (method.equals("geom")) {
                      try {
                          String[] g = (arg == null ? "" : arg).split(",");
                          if (g.length >= 4) {
                              diag.edit().putInt("blkW", Integer.parseInt(g[0].trim())).putInt("blkH", Integer.parseInt(g[1].trim()))
                                      .putInt("keyW", Integer.parseInt(g[2].trim())).putInt("keyH", Integer.parseInt(g[3].trim())).apply();
                          }
                      } catch (NumberFormatException ignored) { }
                  } else if (method.equals("load")) {
                      diag.edit().putString("status", arg == null ? "" : arg)
                              .putLong("loadTime", System.currentTimeMillis()).apply();
                  }
                  return out;
              }

              @Override public Cursor query(Uri u, String[] p, String s, String[] a, String o) { return null; }
              @Override public String getType(Uri u) { return null; }
              @Override public Uri insert(Uri u, ContentValues v) { return null; }
              @Override public int delete(Uri u, String s, String[] a) { return 0; }
              @Override public int update(Uri u, ContentValues v, String s, String[] a) { return 0; }
          }
          PINSKIN_EOF
          mkdir -p 'app/src/main/java/com/pinskin/lsp'
          cat > 'app/src/main/java/com/pinskin/lsp/GlassDrawable.java' <<'PINSKIN_EOF'
          package com.pinskin.lsp;

          import android.graphics.Canvas;
          import android.graphics.ColorFilter;
          import android.graphics.LinearGradient;
          import android.graphics.Paint;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.graphics.Shader;
          import android.graphics.drawable.Drawable;

          /** Фон «жидкого стекла»: полупрозрачная заливка, верхний блик и градиентная кромка. */
          public final class GlassDrawable extends Drawable {
              private final Paint tintP = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint fillP = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint glossP = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint edgeP = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF r = new RectF();
              private final float radius;
              private final float stroke;

              /** tint: ARGB-подкраска под стеклом (0 = нет). */
              public GlassDrawable(float radiusPx, float strokePx, int tint) {
                  radius = radiusPx;
                  stroke = strokePx;
                  tintP.setColor(tint);
                  edgeP.setStyle(Paint.Style.STROKE);
                  edgeP.setStrokeWidth(strokePx);
              }

              @Override
              protected void onBoundsChange(Rect b) {
