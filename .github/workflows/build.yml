          package com.pinskin.lsp;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.DashPathEffect;
          import android.graphics.Paint;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;

          import java.util.List;

          /**
           * Прозрачный слой над превью клавиатуры: рисует картинку и позволяет её перетаскивать.
           * Опорный прямоугольник считается так же, как на телефоне: границы кнопок-цифр (с их масштабом).
           */
          public final class OverlayLayer extends View {
              private final SharedPreferences sp;
              private Cfg cfg;
              private Bitmap bmp;
              private boolean dragMode, dragging;
              private float offX, offY;
              private ViewGroup root;
              private List<View> keyViews;
              private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.FILTER_BITMAP_FLAG);
              private final Paint frame = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final RectF kp = new RectF();
              private final Rect tmp = new Rect();
              private final Rect uni = new Rect();

              public OverlayLayer(Context c, SharedPreferences sp) {
                  super(c);
                  this.sp = sp;
                  float d = c.getResources().getDisplayMetrics().density;
                  frame.setStyle(Paint.Style.STROKE);
                  frame.setStrokeWidth(2f * d);
                  frame.setColor(0xFFFF3B5C);
                  frame.setPathEffect(new DashPathEffect(new float[]{14f * d / 2f, 10f * d / 2f}, 0f));
                  reload();
              }

              /** root: контейнер, в координатах которого лежат кнопки и этот слой. */
              public void setKeys(ViewGroup root, List<View> keyViews) {
                  this.root = root;
                  this.keyViews = keyViews;
                  invalidate();
              }

              public void setDragMode(boolean on) { dragMode = on; invalidate(); }

              public void reload() {
                  cfg = Cfg.from(sp);
                  bmp = cfg.ovEnabled ? PinOverlay.bitmap(cfg.ovImage) : null;
                  invalidate();
              }

              /** Блок цифр = объединение границ кнопок (как PinOverlay на телефоне). */
              private void keypadRect(RectF out) {
                  if (root != null && keyViews != null) {
                      boolean any = false;
                      for (View k : keyViews) {
                          if (k.getWidth() <= 0 || k.getHeight() <= 0) continue;
                          tmp.set(0, 0, k.getWidth(), k.getHeight());
                          try { root.offsetDescendantRectToMyCoords(k, tmp); } catch (Throwable t) { continue; }
                          if (!any) { uni.set(tmp); any = true; } else uni.union(tmp);
                      }
                      if (any && !uni.isEmpty()) { out.set(uni); return; }
                  }
                  out.set(0, 0, getWidth(), getHeight());
              }

              @Override
              protected void onDraw(Canvas c) {
                  if (bmp == null) return;
                  keypadRect(kp);
                  PinOverlay.draw(c, kp, bmp, cfg.ovSize, cfg.ovRot, cfg.ovX, cfg.ovY, paint);
                  if (dragMode) {
                      float w = PinOverlay.imageWidth(kp, cfg.ovSize);
                      float h = PinOverlay.imageHeight(w, bmp);
                      c.save();
                      c.translate(kp.left + kp.width() * cfg.ovX / 1000f, kp.top + kp.height() * cfg.ovY / 1000f);
                      c.rotate(cfg.ovRot);
                      c.drawRect(-w / 2f, -h / 2f, w / 2f, h / 2f, frame);
                      c.restore();
                  }
              }

              @Override
              public boolean onTouchEvent(MotionEvent e) {
                  if (!dragMode || bmp == null || getWidth() == 0 || getHeight() == 0) return false;
                  float x = e.getX(), y = e.getY();
                  switch (e.getActionMasked()) {
                      case MotionEvent.ACTION_DOWN: {
                          keypadRect(kp);
                          float w = PinOverlay.imageWidth(kp, cfg.ovSize);
                          float h = PinOverlay.imageHeight(w, bmp);
                          float cx = kp.left + kp.width() * cfg.ovX / 1000f;
                          float cy = kp.top + kp.height() * cfg.ovY / 1000f;
                          double a = Math.toRadians(-cfg.ovRot);
                          float dx = x - cx, dy = y - cy;
                          float lx = (float) (dx * Math.cos(a) - dy * Math.sin(a));
                          float ly = (float) (dx * Math.sin(a) + dy * Math.cos(a));
                          if (Math.abs(lx) <= w / 2f && Math.abs(ly) <= h / 2f) {
                              dragging = true;
                              offX = cx - x;
                              offY = cy - y;
                              if (getParent() != null) getParent().requestDisallowInterceptTouchEvent(true);
                              return true;
                          }
                          return false;
                      }
                      case MotionEvent.ACTION_MOVE:
                          if (!dragging) return false;
                          keypadRect(kp);
                          if (kp.width() <= 0f || kp.height() <= 0f) return true;
                          cfg.ovX = clamp(Math.round((x + offX - kp.left) / kp.width() * 1000f));
                          cfg.ovY = clamp(Math.round((y + offY - kp.top) / kp.height() * 1000f));
                          invalidate();
                          return true;
                      case MotionEvent.ACTION_UP:
                      case MotionEvent.ACTION_CANCEL:
                          if (dragging) {
                              dragging = false;
                              sp.edit().putInt(Cfg.K_OV_X, cfg.ovX).putInt(Cfg.K_OV_Y, cfg.ovY).apply();
                              if (getParent() != null) getParent().requestDisallowInterceptTouchEvent(false);
                              return true;
                          }
                          return false;
                      default:
                          return dragging;
                  }
              }

              private static int clamp(int v) { return Math.max(0, Math.min(1000, v)); }
          }
