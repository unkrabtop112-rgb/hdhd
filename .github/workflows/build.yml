              private void select(int idx) {
                  if (idx == selected) return;
                  final int old = selected;
                  selected = idx;
                  indicator.animate().translationX(idx * dp(116)).setDuration(420)
                          .setInterpolator(new OvershootInterpolator(1.15f)).start();
                  updateTabColors();

                  final View out = pages[old];
                  out.animate().cancel();
                  out.animate().alpha(0f).setDuration(140).withEndAction(() -> {
                      if (selected != old) out.setVisibility(View.GONE);
                      out.setAlpha(1f);
                  }).start();

                  View in = pages[idx];
                  in.animate().cancel();
                  in.setAlpha(1f);
                  in.setVisibility(View.VISIBLE);
                  ((ScrollView) in).scrollTo(0, 0);
                  playEntrance(cols[idx]);
              }

              private void updateTabColors() {
                  for (int i = 0; i < 2; i++) tabLabels[i].setTextColor(i == selected ? 0xFFFFFFFF : TEXT2);
              }

              private void playEntrance(LinearLayout col) {
                  for (int i = 0; i < col.getChildCount(); i++) {
                      View ch = col.getChildAt(i);
                      ch.setAlpha(0f);
                      ch.setTranslationY(dp(22));
                      ch.animate().alpha(1f).translationY(0f).setStartDelay(Math.min(i, 8) * 45L)
                              .setDuration(380).setInterpolator(new DecelerateInterpolator(1.6f)).start();
                  }
              }

