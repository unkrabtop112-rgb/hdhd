                          Shader.TileMode.CLAMP));
              }

              @Override
              public void draw(Canvas c) {
                  if (r.isEmpty()) return;
                  if ((tintP.getColor() >>> 24) != 0) c.drawRoundRect(r, radius, radius, tintP);
                  c.drawRoundRect(r, radius, radius, fillP);
                  c.drawRoundRect(r, radius, radius, glossP);
                  c.drawRoundRect(r, radius, radius, edgeP);
              }

              @Override public void setAlpha(int a) {
                  fillP.setAlpha(a); glossP.setAlpha(a); edgeP.setAlpha(a); invalidateSelf();
              }
              @Override public void setColorFilter(ColorFilter f) {}
              @Override public int getOpacity() { return PixelFormat.TRANSLUCENT; }
          }
