              // ====================================================================== Preview
              private void buildPreview() {
                  LinearLayout box = new LinearLayout(this);
                  box.setBackground(new GlassDrawable(dpf(22), dpf(1f), 0x66000000));
                  box.setGravity(Gravity.CENTER);
                  box.setPadding(dp(8), dp(22), dp(8), dp(22));
                  box.setClipChildren(false);
                  box.setClipToPadding(false);

                  // Пропорции блока цифр берём с телефона (их присылает хук из SystemUI), чтобы превью совпадало с экраном PIN.
                  SharedPreferences dg = Cfg.diag(this);
                  float bw = dg.getInt("blkW", 0), bh = dg.getInt("blkH", 0);
                  float kw = dg.getInt("keyW", 0), kh = dg.getInt("keyH", 0);
                  if (!(bw > 0 && bh > 0 && kw > 0 && kh > 0 && kw < bw && kh < bh)) {
                      bw = 3; bh = 4; kw = 1; kh = 1;   // нет данных: квадратные кнопки вплотную
                  }
                  int avail = getResources().getDisplayMetrics().widthPixels - dp(32 + 36 + 16);
                  int gridW = Math.min(dp(264), avail);
                  int gridH = Math.round(gridW * (bh / bw));
                  int keyW = Math.round(gridW * (kw / bw));
                  int keyH = Math.round(gridH * (kh / bh));
                  float pitchX = (gridW - keyW) / 2f;
                  float pitchY = (gridH - keyH) / 3f;

                  FrameLayout grid = new FrameLayout(this);
                  grid.setClipChildren(false);
                  grid.setClipToPadding(false);
                  int[][] pos = {{3, 1}, {0, 0}, {0, 1}, {0, 2}, {1, 0}, {1, 1}, {1, 2}, {2, 0}, {2, 1}, {2, 2}};   // цифра -> {ряд, колонка}
                  for (int d = 1; d <= 10; d++) {
                      int digitVal = d % 10;
                      FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(keyW, keyH, Gravity.TOP | Gravity.START);
                      lp.leftMargin = Math.round(pos[digitVal][1] * pitchX);
                      lp.topMargin = Math.round(pos[digitVal][0] * pitchY);

                      FrameLayout key = new FrameLayout(this);
                      LinearLayout inner = new LinearLayout(this);
                      inner.setOrientation(LinearLayout.VERTICAL);
                      inner.setGravity(Gravity.CENTER);
                      TextView digit = new TextView(this);
                      digit.setText(String.valueOf(digitVal));
                      digit.setTextSize(26);
                      digit.setGravity(Gravity.CENTER);
                      TextView letters = new TextView(this);
                      letters.setText(digitVal >= 1 ? LETTERS[digitVal - 1 < LETTERS.length ? digitVal - 1 : 0] : "");
                      letters.setTextSize(9);
                      letters.setGravity(Gravity.CENTER);
                      inner.addView(digit);
                      inner.addView(letters);
                      key.addView(inner, new FrameLayout.LayoutParams(-1, -1, Gravity.CENTER));
                      key.setClickable(true);   // иначе кнопка не получит продолжение касания (UP) и анимация не вернётся
                      key.setOnTouchListener((kv, ev) -> { PressAnim.onTouch(kv, ev, lastCfg); return false; });
                      keys.add(key);
                      grid.addView(key, lp);
                  }
                  FrameLayout stack = new FrameLayout(this);
                  stack.setClipChildren(false);
                  stack.addView(grid, new FrameLayout.LayoutParams(gridW, gridH));
                  overlayLayer = new OverlayLayer(this, sp);
                  overlayLayer.setKeys(stack, keys);
                  stack.addView(overlayLayer, new FrameLayout.LayoutParams(-1, -1));
                  box.addView(stack);
                  LinearLayout.LayoutParams blp = new LinearLayout.LayoutParams(-1, -2);
                  blp.topMargin = dp(6);
                  cur.addView(box, blp);
              }

              private void refresh() {
                  Cfg c = Cfg.from(sp);
                  c.enabled = true; // в превью всегда показываем стиль
                  lastCfg = c;
                  for (View k : keys) KeyStyler.apply(k, c);
                  if (overlayLayer != null) overlayLayer.reload();
              }

              // ====================================================================== Image
              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (res != RESULT_OK || data == null || data.getData() == null) return;
                  try {
                      if (req == REQ_IMG) {
                          String b64 = encode(data.getData());
                          sp.edit().putString(Cfg.K_IMG, b64).putBoolean(Cfg.K_USE_IMG, true).apply();
                          recreate();
                      } else if (req == REQ_OV_IMG) {
                          String b64 = encodeOverlay(data.getData());
                          sp.edit().putString(Cfg.K_OV_IMG, b64).putBoolean(Cfg.K_OV_ENABLED, true).apply();
                          recreate();
                      } else if (req >= REQ_KEY_BASE && req < REQ_KEY_BASE + 10) {
                          int dg = req - REQ_KEY_BASE;
                          String kb64 = encodeKeyImage(data.getData());
                          sp.edit().putString(Cfg.K_KEYIMG + dg, kb64).apply();
                          updateThumb(dg);
                          refresh();
                      }
                  } catch (Exception e) {
                      Toast.makeText(this, "Не удалось прочитать картинку", Toast.LENGTH_LONG).show();
                  }
              }

              /** Картинка поверх клавиатуры: до 400 px, с прозрачностью (WEBP). Размер ограничен, чтобы пролезть через Binder. */
              @SuppressWarnings("deprecation")
              private String encodeOverlay(Uri u) throws Exception {
                  BitmapFactory.Options o = new BitmapFactory.Options();
                  o.inJustDecodeBounds = true;
                  try (InputStream in = getContentResolver().openInputStream(u)) {
                      BitmapFactory.decodeStream(in, null, o);
                  }
                  int big = Math.max(o.outWidth, o.outHeight);
                  int[] sides = {400, 320, 256, 192};
                  for (int side : sides) {
                      int sample = 1;
                      while (big / (sample * 2) >= side) sample *= 2;
                      BitmapFactory.Options o2 = new BitmapFactory.Options();
                      o2.inSampleSize = sample;
                      Bitmap bmp;
                      try (InputStream in = getContentResolver().openInputStream(u)) {
                          bmp = BitmapFactory.decodeStream(in, null, o2);
                      }
                      if (bmp == null) throw new Exception("decode failed");
                      float k = Math.min(1f, side / (float) Math.max(bmp.getWidth(), bmp.getHeight()));
                      Bitmap sc = k < 1f
                              ? Bitmap.createScaledBitmap(bmp, Math.max(1, Math.round(bmp.getWidth() * k)),
                                      Math.max(1, Math.round(bmp.getHeight() * k)), true)
                              : bmp;
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      if (bmp.hasAlpha()) sc.compress(Bitmap.CompressFormat.WEBP, 90, bo);
                      else sc.compress(Bitmap.CompressFormat.JPEG, 88, bo);
                      String b64 = Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP);
                      if (b64.length() <= 150000 || side == 192) return b64;
                  }
                  throw new Exception("too big");
              }

              /** Картинка для одной кнопки: квадрат до 128 px, мало байт (ограничение Binder). */
              @SuppressWarnings("deprecation")
              private String encodeKeyImage(Uri u) throws Exception {
                  BitmapFactory.Options o = new BitmapFactory.Options();
                  o.inJustDecodeBounds = true;
                  try (InputStream in = getContentResolver().openInputStream(u)) {
                      BitmapFactory.decodeStream(in, null, o);
                  }
                  int big = Math.max(o.outWidth, o.outHeight);
                  int sample = 1;
                  while (big / (sample * 2) >= 256) sample *= 2;
                  BitmapFactory.Options o2 = new BitmapFactory.Options();
                  o2.inSampleSize = sample;
                  Bitmap bmp;
                  try (InputStream in = getContentResolver().openInputStream(u)) {
                      bmp = BitmapFactory.decodeStream(in, null, o2);
                  }
                  if (bmp == null) throw new Exception("decode failed");
                  String last = "";
                  for (int side : new int[]{128, 112, 96, 80}) {
                      Bitmap sq = ThumbnailUtils.extractThumbnail(bmp, side, side);
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      if (bmp.hasAlpha()) sq.compress(Bitmap.CompressFormat.WEBP, 85, bo);
                      else sq.compress(Bitmap.CompressFormat.JPEG, 85, bo);
                      last = Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP);
                      if (last.length() <= 16000) break;
                  }
                  return last;
              }

              private String encode(Uri u) throws Exception {
                  BitmapFactory.Options o = new BitmapFactory.Options();
                  o.inJustDecodeBounds = true;
                  try (InputStream in = getContentResolver().openInputStream(u)) {
                      BitmapFactory.decodeStream(in, null, o);
                  }
                  int big = Math.max(o.outWidth, o.outHeight), s = 1;
                  while (big / s > 512) s *= 2;
                  o = new BitmapFactory.Options();
                  o.inSampleSize = s;
                  Bitmap bmp;
                  try (InputStream in = getContentResolver().openInputStream(u)) {
                      bmp = BitmapFactory.decodeStream(in, null, o);
                  }
                  if (bmp == null) throw new Exception("decode failed");
                  Bitmap sq = ThumbnailUtils.extractThumbnail(bmp, 192, 192);
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  sq.compress(bmp.hasAlpha() ? Bitmap.CompressFormat.PNG : Bitmap.CompressFormat.JPEG, 90, bo);
                  return Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP);
              }

              // ====================================================================== Restart SystemUI
              private void restartSystemUi() {
                  new Thread(() -> {
                      String msg;
                      try {
                          Process p = new ProcessBuilder("su", "-c", "kill $(pidof com.android.systemui)").start();
                          int code = p.waitFor();
                          msg = code == 0 ? "SystemUI перезапускается" : "su вернул код " + code + ". Перезагрузи телефон.";
                      } catch (Exception e) {
                          msg = "Нет root-доступа. Перезагрузи телефон.";
                      }
                      final String m = msg;
                      runOnUiThread(() -> Toast.makeText(this, m, Toast.LENGTH_LONG).show());
                  }).start();
              }
          }
