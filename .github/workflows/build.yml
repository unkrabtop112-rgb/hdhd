              // ====================================================================== per-key images
              private void keyImageGrid() {
                  GridLayout g = new GridLayout(this);
                  g.setColumnCount(3);
                  int[] order = {1, 2, 3, 4, 5, 6, 7, 8, 9, -1, 0, -1};
                  for (int d : order) {
                      GridLayout.LayoutParams lp = new GridLayout.LayoutParams();
                      lp.width = dp(72);
                      lp.height = dp(72);
                      lp.setMargins(dp(5), dp(5), dp(5), dp(5));
                      if (d < 0) { g.addView(new View(this), lp); continue; }
                      final int digit = d;
                      FrameLayout cell = new FrameLayout(this);
                      cell.setBackground(new GlassDrawable(dpf(22), dpf(1f), 0));
                      ImageView iv = new ImageView(this);
                      iv.setScaleType(ImageView.ScaleType.CENTER_CROP);
                      iv.setOutlineProvider(new ViewOutlineProvider() {
                          @Override public void getOutline(View x, Outline o) {
                              o.setRoundRect(0, 0, x.getWidth(), x.getHeight(), x.getWidth() * 0.3f);
                          }
                      });
                      iv.setClipToOutline(true);
                      cell.addView(iv, new FrameLayout.LayoutParams(-1, -1));
                      TextView lbl = tv(String.valueOf(d), 22, TEXT2, true);
                      lbl.setGravity(Gravity.CENTER);
                      cell.addView(lbl, new FrameLayout.LayoutParams(-1, -1));
                      keyThumbs[d] = iv;
                      keyThumbTxt[d] = lbl;
                      cell.setOnClickListener(v -> {
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.setType("image/*");
                          startActivityForResult(i, REQ_KEY_BASE + digit);
                      });
                      cell.setOnLongClickListener(v -> {
                          sp.edit().remove(Cfg.K_KEYIMG + digit).apply();
                          updateThumb(digit);
                          refresh();
                          return true;
                      });
                      pressable(cell);
                      g.addView(cell, lp);
                      updateThumb(d);
                  }
                  LinearLayout.LayoutParams glp = new LinearLayout.LayoutParams(-2, -2);
                  glp.gravity = Gravity.CENTER_HORIZONTAL;
                  cur.addView(g, glp);
              }

              private void updateThumb(int d) {
                  if (keyThumbs[d] == null) return;
                  Bitmap bm = null;
                  String b64 = sp.getString(Cfg.K_KEYIMG + d, "");
                  if (b64 != null && !b64.isEmpty()) {
                      try {
                          byte[] raw = Base64.decode(b64, Base64.NO_WRAP);
                          bm = BitmapFactory.decodeByteArray(raw, 0, raw.length);
                      } catch (Throwable ignored) { }
                  }
                  if (bm != null) {
                      keyThumbs[d].setImageBitmap(bm);
                      keyThumbTxt[d].setVisibility(View.GONE);
                  } else {
                      keyThumbs[d].setImageDrawable(null);
                      keyThumbTxt[d].setVisibility(View.VISIBLE);
                  }
              }

              // ====================================================================== custom labels
              private void labelGrid() {
                  GridLayout g = new GridLayout(this);
                  g.setColumnCount(3);
                  int[] order = {1, 2, 3, 4, 5, 6, 7, 8, 9, -1, 0, -1};
                  for (int d : order) {
