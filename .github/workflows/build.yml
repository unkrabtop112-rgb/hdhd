          package com.pinskin.lsp;

          import android.app.Application;
          import android.content.Context;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;

          import java.lang.ref.WeakReference;
          import java.util.Enumeration;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.ThreadFactory;

          import dalvik.system.DexFile;
          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          public class Hook implements IXposedHookLoadPackage {
              private static final String TAG = "PinSkin: ";
              private static final Uri URI = Uri.parse("content://com.pinskin.lsp.config/cfg");
              // Имя класса кнопки цифры из AOSP. На HiOS 13 (Tecno KJ6) диагностика показывала, что хук срабатывает.
              private static final String[] KEY_CLASSES = { "com.android.keyguard.NumPadKey" };

              // Все обращения к приложению идут в фоне: главный поток SystemUI никогда не ждёт чужой процесс.
              private static final ExecutorService EX = Executors.newSingleThreadExecutor(new ThreadFactory() {
                  @Override public Thread newThread(Runnable r) {
                      Thread t = new Thread(r, "PinSkin-cfg");
                      t.setDaemon(true);
                      return t;
                  }
              });
              private static volatile Cfg cached;
              private static volatile long cachedAt;
              private static volatile int fails;
              private static volatile long blockedUntil;
              private static volatile long lastReport;

              private static void bump() {
                  int f = fails + 1;
                  if (f >= 3) { fails = 0; blockedUntil = SystemClock.uptimeMillis() + 60000L; }
                  else fails = f;
              }

              private static void applyAll(final View v, Cfg c, final Class<?> cls) {
                  try {
                      KeyStyler.apply(v, c);
                      final WeakReference<View> ref = new WeakReference<View>(v);
                      PinOverlay.attach(v, c, cls, new Runnable() {
                          @Override public void run() {
                              View k = ref.get();
                              if (k != null) withConfig(k, cls);
                          }
                      });
                      report(v);
                  } catch (Throwable t) {
                      XposedBridge.log(TAG + "apply failed: " + t);
                  }
              }

              /** Отправляет в приложение строку диагностики про картинку (не чаще раза в 5 с, в фоне). */
              private static void report(View v) {
                  long now = SystemClock.uptimeMillis();
                  if (now - lastReport < 5000L) return;
                  lastReport = now;
                  final Context ctx = v.getContext();
                  final String line = PinOverlay.statusLine();
                  final String geom = PinOverlay.geomLine();
                  EX.execute(new Runnable() {
                      @Override public void run() {
                          try { ctx.getContentResolver().call(URI, "ov", line, null); } catch (Throwable ignored) {}
                          if (!geom.isEmpty()) {
                              try { ctx.getContentResolver().call(URI, "geom", geom, null); } catch (Throwable ignored) {}
                          }
                      }
                  });
              }

              private static void withConfig(final View v, final Class<?> cls) {
                  long now = SystemClock.uptimeMillis();
                  Cfg c = cached;
                  if (c != null && now - cachedAt < 1500) { applyAll(v, c, cls); return; }
                  if (now < blockedUntil) { if (c != null) applyAll(v, c, cls); return; }
                  final Context ctx = v.getContext();
                  EX.execute(new Runnable() {
                      @Override public void run() {
                          try {
                              long n = SystemClock.uptimeMillis();
                              if (!(cached != null && n - cachedAt < 1500)) {
                                  Bundle b = ctx.getContentResolver().call(URI, "cfg", null, null);
                                  if (b != null) { cached = Cfg.from(b); cachedAt = SystemClock.uptimeMillis(); fails = 0; }
                                  else bump();
                              }
                          } catch (Throwable t) {
                              bump();
                              XposedBridge.log(TAG + "provider call failed: " + t);
                          }
                          final Cfg res = cached;
                          if (res != null) {
                              v.post(new Runnable() {
                                  @Override public void run() { applyAll(v, res, cls); }
                              });
                          }
                      }
                  });
              }

              @Override
              public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpp) {
                  if (!"com.android.systemui".equals(lpp.packageName)) return;

                  final StringBuilder st = new StringBuilder();
                  final java.util.List<Class<?>> keyClasses = new java.util.ArrayList<>();
                  int hooked = 0;
                  for (String name : KEY_CLASSES) {
                      Class<?> found = XposedHelpers.findClassIfExists(name, lpp.classLoader);
                      if (found == null) {
                          XposedBridge.log(TAG + "class not found: " + name);
                          st.append("класс НЕ найден: ").append(name).append("; ");
                          continue;
                      }
                      final Class<?> cls = found;
                      keyClasses.add(cls);
                      XposedBridge.hookAllConstructors(cls, new XC_MethodHook() {
                          @Override
                          protected void afterHookedMethod(MethodHookParam param) {
                              try {
                                  if (!(param.thisObject instanceof View)) return;
                                  final View v = (View) param.thisObject;
                                  v.post(new Runnable() {
                                      @Override public void run() {
                                          try { withConfig(v, cls); } catch (Throwable t) { XposedBridge.log(t); }
                                      }
                                  });
                              } catch (Throwable t) {
                                  XposedBridge.log(t);
                              }
                          }
                      });
                      hooked++;
                      st.append("класс найден и перехвачен: ").append(name).append("; ");
                      XposedBridge.log(TAG + "hooked constructors of " + name);
                  }
                  if (hooked == 0) st.append("похожие классы: ").append(candidates(lpp));

                  PinOverlay.dumpSink = new PinOverlay.DumpSink() {
                      @Override public void send(final Context ctx, final String dump) {
                          EX.execute(new Runnable() {
                              @Override public void run() {
                                  try { ctx.getContentResolver().call(URI, "dump", dump, null); } catch (Throwable ignored) { }
                              }
                          });
                      }
                  };

                  if (!keyClasses.isEmpty()) {
                      try {
                          XposedHelpers.findAndHookMethod(ViewGroup.class, "dispatchTouchEvent", MotionEvent.class, new XC_MethodHook() {
                              @Override
                              protected void beforeHookedMethod(MethodHookParam param) {
                                  try {
                                      Object o = param.thisObject;
                                      for (Class<?> k : keyClasses) {
                                          if (k.isInstance(o)) {
                                              PressAnim.onTouch((View) o, (MotionEvent) param.args[0], cached);
                                              return;
                                          }
                                      }
                                  } catch (Throwable t) {
                                      XposedBridge.log(TAG + "touch hook: " + t);
                                  }
                              }
                          });
                      } catch (Throwable t) {
                          XposedBridge.log(TAG + "touch hook failed: " + t);
                      }
                  }

                  final String status = st + " | " + Build.MANUFACTURER + " " + Build.MODEL
                          + " | " + Build.DISPLAY + " | Android " + Build.VERSION.RELEASE;
                  try {
                      XposedHelpers.findAndHookMethod(Application.class, "onCreate", new XC_MethodHook() {
                          @Override
                          protected void afterHookedMethod(MethodHookParam param) {
                              try {
                                  final Context ctx = (Context) param.thisObject;
                                  Thread t = new Thread(new Runnable() {
                                      @Override public void run() {
                                          try { Thread.sleep(5000L); } catch (InterruptedException e) { return; }
                                          try { ctx.getContentResolver().call(URI, "load", status, null); }
                                          catch (Throwable e) { XposedBridge.log(TAG + "report failed: " + e); }
                                      }
                                  }, "PinSkin-report");
                                  t.setDaemon(true);
                                  t.start();
                              } catch (Throwable t) {
                                  XposedBridge.log(t);
                              }
                          }
                      });
                  } catch (Throwable t) {
                      XposedBridge.log(TAG + "Application hook failed: " + t);
                  }
              }

              @SuppressWarnings("deprecation")
              private String candidates(XC_LoadPackage.LoadPackageParam lpp) {
                  StringBuilder sb = new StringBuilder();
                  try {
                      DexFile df = new DexFile(lpp.appInfo.sourceDir);
                      Enumeration<String> e = df.entries();
                      int n = 0;
                      while (e.hasMoreElements() && n < 40) {
                          String s = e.nextElement();
                          String l = s.toLowerCase();
                          if (l.contains("numpad") || l.contains("pinkey") || l.contains("keyguardpin")) {
                              sb.append(s).append(", ");
                              n++;
                          }
                      }
                      df.close();
                  } catch (Throwable t) {
                      XposedBridge.log(t);
                      sb.append("(не удалось просканировать)");
                  }
                  return sb.length() == 0 ? "ничего не найдено" : sb.toString();
              }
          }
