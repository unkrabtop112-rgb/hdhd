          package com.pinskin.lsp;

          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.ColorFilter;
          import android.graphics.Paint;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.graphics.Rect;
          import android.graphics.RectF;
          import android.graphics.drawable.Drawable;

          /**
           * Фон кнопки: круг / скруглённый квадрат / квадрат с зазором внутри клетки кнопки.
           * Круг всегда круглый (диаметр = меньшая сторона минус зазор), чтобы соседние кнопки не слипались.
           */
          public final class KeyShape extends Drawable {
              private final int shape;
              private final int color;
              private final Bitmap bmp;
              private final float gapFrac;
              private final float density;
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.FILTER_BITMAP_FLAG);
              private final Path path = new Path();
              private final RectF r = new RectF();

              /** gapPct: 0..40 — какая часть меньшей стороны клетки остаётся пустой. */
              public KeyShape(int shape, int color, Bitmap bmp, int gapPct, float density) {
                  this.shape = shape;
                  this.color = color;
                  this.bmp = bmp;
                  this.gapFrac = Math.max(0, Math.min(40, gapPct)) / 100f;
                  this.density = density;
              }

              @Override
              protected void onBoundsChange(Rect b) {
                  float m = Math.min(b.width(), b.height());
                  path.reset();
                  if (shape == 0) {
                      float s = m * (1f - gapFrac);
                      r.set(b.exactCenterX() - s / 2f, b.exactCenterY() - s / 2f, b.exactCenterX() + s / 2f, b.exactCenterY() + s / 2f);
                      path.addOval(r, Path.Direction.CW);
                  } else {
                      float g = m * gapFrac / 2f;
                      r.set(b.left + g, b.top + g, b.right - g, b.bottom - g);
                      float rad = shape == 1 ? Math.min(18f * density, m * 0.3f) : 0f;
                      path.addRoundRect(r, rad, rad, Path.Direction.CW);
                  }
              }

              @Override
              public void draw(Canvas c) {
                  if (r.isEmpty()) return;
                  if (bmp != null) {
                      c.save();
                      c.clipPath(path);
                      c.drawBitmap(bmp, null, r, p);
                      c.restore();
                  } else {
                      p.setColor(color);
                      c.drawPath(path, p);
                  }
              }

              @Override public void setAlpha(int a) { p.setAlpha(a); }
              @Override public void setColorFilter(ColorFilter f) { p.setColorFilter(f); }
              @Override public int getOpacity() { return PixelFormat.TRANSLUCENT; }
          }
