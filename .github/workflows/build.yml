          package com.pinskin.lsp;

          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Outline;
          import android.graphics.drawable.BitmapDrawable;
          import android.graphics.drawable.GradientDrawable;
          import android.util.Base64;
          import android.util.TypedValue;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.ViewOutlineProvider;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.WeakHashMap;

          /** Оформляет одну кнопку клавиатуры. Один и тот же код для превью и для SystemUI. */
          public final class KeyStyler {
              private static final WeakHashMap<TextView, Float> ORIG_SIZE = new WeakHashMap<>();
              private static final WeakHashMap<TextView, String> ORIG_TEXT = new WeakHashMap<>();
              private static final LinkedHashMap<String, Bitmap> CACHE = new LinkedHashMap<String, Bitmap>(16, 0.75f, true) {
                  @Override protected boolean removeEldestEntry(Map.Entry<String, Bitmap> e) { return size() > 14; }
              };

              private KeyStyler() {}

              private static synchronized Bitmap bitmap(String b64) {
                  if (b64 == null || b64.isEmpty()) return null;
                  Bitmap hit = CACHE.get(b64);
                  if (hit != null) return hit;
                  try {
                      byte[] raw = Base64.decode(b64, Base64.NO_WRAP);
                      Bitmap b = BitmapFactory.decodeByteArray(raw, 0, raw.length);
                      if (b != null) CACHE.put(b64, b);
                      return b;
                  } catch (Throwable t) {
                      return null;
                  }
              }

              /** Исходная цифра кнопки (запоминается при первой встрече, потом подмена надписи её не ломает). */
              private static String origOf(TextView digit) {
                  if (digit == null) return null;
                  String o = ORIG_TEXT.get(digit);
                  if (o == null) {
                      CharSequence t0 = digit.getText();
                      if (t0 != null && t0.length() == 1 && Character.isDigit(t0.charAt(0))) {
                          o = t0.toString();
                          ORIG_TEXT.put(digit, o);
                      }
                  }
                  return o;
              }

              private static void collect(View v, List<TextView> out) {
                  if (v instanceof TextView) {
                      out.add((TextView) v);
                  } else if (v instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) v;
                      for (int i = 0; i < g.getChildCount(); i++) collect(g.getChildAt(i), out);
                  }
              }

              public static void apply(View key, Cfg c) {
                  if (!c.enabled) return;
                  float density = key.getResources().getDisplayMetrics().density;

                  List<TextView> tvs = new ArrayList<>();
                  collect(key, tvs);
                  TextView digit = null, letters = null;
                  for (TextView tv : tvs) {
                      CharSequence t = tv.getText();
                      if (digit == null && (ORIG_TEXT.containsKey(tv)
                              || (t != null && t.length() == 1 && Character.isDigit(t.charAt(0))))) digit = tv;
                      else if (letters == null) letters = tv;
                  }
                  if (digit == null && !tvs.isEmpty()) {
                      digit = tvs.get(0);
                      letters = tvs.size() > 1 ? tvs.get(1) : null;
                  }

                  // Фон кнопки
                  final int shape = c.shape;
                  Bitmap bmp = c.useImage ? bitmap(c.imageB64) : null;
                  String keyOrig = origOf(digit);
                  if (c.keyImgOn && keyOrig != null) {
                      int kd = keyOrig.charAt(0) - '0';
                      if (kd >= 0 && kd <= 9 && c.keyImages[kd] != null && !c.keyImages[kd].isEmpty()) {
                          Bitmap kb = bitmap(c.keyImages[kd]);
                          if (kb != null) bmp = kb;
                      }
                  }
                  key.setBackground(new KeyShape(shape, c.bgColor, bmp, c.keyGap, density));
                  key.setOutlineProvider(ViewOutlineProvider.BACKGROUND);
                  key.setClipToOutline(false);

                  // Текст
                  if (digit != null) {
                      // Подмена надписи (ввод кнопки не меняется: NumPadKey шлёт свою цифру)
                      String origText = ORIG_TEXT.get(digit);
                      if (origText == null) {
                          CharSequence t0 = digit.getText();
                          if (t0 != null && t0.length() == 1 && Character.isDigit(t0.charAt(0))) {
                              origText = t0.toString();
                              ORIG_TEXT.put(digit, origText);
                          }
                      }
                      if (origText != null) {
                          String show = origText;
                          if (c.hideDigits) show = "";
                          if (c.customLabels) {
                              int di = origText.charAt(0) - '0';
                              if (di >= 0 && di <= 9 && c.labels[di] != null && !c.labels[di].isEmpty()) show = c.labels[di];
                          }
                          if (!show.contentEquals(digit.getText())) digit.setText(show);
                      }
                      digit.setTextColor(c.textColor);
                      Float orig = ORIG_SIZE.get(digit);
                      if (orig == null) { orig = digit.getTextSize(); ORIG_SIZE.put(digit, orig); }
                      digit.setTextSize(TypedValue.COMPLEX_UNIT_PX, orig * c.textScale / 100f);
                  }
                  if (letters != null) {
                      if (c.hideLetters) letters.setVisibility(View.GONE);
                      else letters.setTextColor(c.textColor);
                  }

                  // Размер, прозрачность, обрезка
                  float small = c.small ? 0.8f : 1f;
                  float bx = c.stretchX / 100f * small;
                  float by = c.stretchY / 100f * small;
                  key.setScaleX(bx);
                  key.setScaleY(by);
                  if (c.pressAnim) key.setStateListAnimator(null);   // сам эффект рисует PressAnim по касанию
                  key.setAlpha(c.opacity / 100f);
                  if (c.noClip || c.pressAnim) {
                      View cur = key;
                      for (int i = 0; i < 4 && cur.getParent() instanceof ViewGroup; i++) {
                          ViewGroup p = (ViewGroup) cur.getParent();
                          p.setClipChildren(false);
                          p.setClipToPadding(false);
                          cur = p;
                      }
                  }
              }
          }
