              private void seek(String label, String key, int min, int max, int val) {
                  seek(label, key, min, max, val, "%");
              }

              private void seek(final String label, final String key, final int min, final int max, int val, final String unit) {
                  LinearLayout top = new LinearLayout(this);
                  top.setPadding(0, dp(12), 0, 0);
                  top.addView(tv(label, 14, TEXT1, false), new LinearLayout.LayoutParams(0, -2, 1f));
                  final TextView v = tv(val + unit, 14, ACCENT, true);
                  top.addView(v);
                  cur.addView(top);

                  SeekBar s = new SeekBar(this);
                  s.setMax(max - min);
                  s.setProgress(val - min);
                  s.setProgressTintList(ColorStateList.valueOf(ACCENT));
                  s.setThumbTintList(ColorStateList.valueOf(0xFFFFFFFF));
                  s.setProgressBackgroundTintList(ColorStateList.valueOf(0x40FFFFFF));
                  s.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar sb, int pr, boolean user) {
                          int x = pr + min;
                          v.setText(x + unit);
                          if (user) { sp.edit().putInt(key, x).apply(); refresh(); }
                      }
                      @Override public void onStartTrackingTouch(SeekBar sb) {}
                      @Override public void onStopTrackingTouch(SeekBar sb) {}
                  });
                  cur.addView(s);
              }

