          /** Картинка поверх блока цифр: математика рисования + прикрепление к окну SystemUI. */
          public final class PinOverlay {
              private PinOverlay() {}

              // --- снимок реальной клавиатуры для отладки (уходит в приложение, там его можно скопировать)
              public interface DumpSink { void send(android.content.Context ctx, String dump); }
              public static volatile DumpSink dumpSink;
              private static long lastDumpAt;
              private static boolean dumpScheduled;

              private static void scheduleDump(final ViewGroup root, final View key, final Class<?> keyCls) {
                  long now = SystemClock.uptimeMillis();
                  if (dumpScheduled || dumpSink == null || now - lastDumpAt < 8000L) return;
                  dumpScheduled = true;
                  root.postDelayed(new Runnable() {
                      @Override public void run() {
                          dumpScheduled = false;
                          lastDumpAt = SystemClock.uptimeMillis();
                          try {
                              DumpSink s = dumpSink;
                              if (s != null) s.send(root.getContext(), buildDump(root, key, keyCls));
                          } catch (Throwable ignored) { }
                      }
                  }, 1500L);
              }

              private static String buildDump(ViewGroup root, View key, Class<?> keyCls) {
                  StringBuilder sb = new StringBuilder(2048);
                  android.util.DisplayMetrics dm = root.getResources().getDisplayMetrics();
                  sb.append("экран ").append(dm.widthPixels).append('x').append(dm.heightPixels)
                          .append(", плотность ").append(dm.density).append('\n');
                  sb.append("цепочка от кнопки к корню (граница в родителе, vis 0=видно, a=alpha, tr=сдвиг, sc=масштаб):\n");
                  View cur = key;
                  for (int i = 0; i < 14 && cur != null; i++) {
                      sb.append(' ').append(i).append(' ').append(cur.getClass().getSimpleName())
                              .append(" [").append(cur.getLeft()).append(',').append(cur.getTop()).append(',')
                              .append(cur.getRight()).append(',').append(cur.getBottom()).append(']')
                              .append(" vis=").append(cur.getVisibility())
                              .append(" a=").append(Math.round(cur.getAlpha() * 100) / 100f)
                              .append(" tr=").append(Math.round(cur.getTranslationX())).append(',').append(Math.round(cur.getTranslationY()))
                              .append(" sc=").append(Math.round(cur.getScaleX() * 100) / 100f).append(',').append(Math.round(cur.getScaleY() * 100) / 100f);
                      if (cur instanceof ViewGroup) sb.append(" clip=").append(((ViewGroup) cur).getClipChildren());
                      sb.append('\n');
                      ViewParent p = cur.getParent();
                      cur = p instanceof View ? (View) p : null;
                  }
                  sb.append("кнопки (подпись, границы в корне с учётом масштаба, alpha, итоговая видимость, на экране):\n");
                  dumpKeys(root, root, keyCls, sb);
                  sb.append("блок по раскладке ").append(lastW).append('x').append(lastH)
                          .append(", кнопка ").append(lastKeyW).append('x').append(lastKeyH).append('\n');
                  if (sb.length() > 6000) sb.setLength(6000);
                  return sb.toString();
              }

              private static void dumpKeys(ViewGroup root, View v, Class<?> keyCls, StringBuilder sb) {
                  if (keyCls.isInstance(v)) {
                      Rect r = new Rect(0, 0, v.getWidth(), v.getHeight());
                      try { root.offsetDescendantRectToMyCoords(v, r); } catch (Throwable t) { r.setEmpty(); }
                      Rect gv = new Rect();
                      boolean on = v.getGlobalVisibleRect(gv);
                      sb.append(" '").append(firstText(v)).append("' [").append(r.left).append(',').append(r.top).append(',')
                              .append(r.right).append(',').append(r.bottom).append("] a=")
                              .append(Math.round(v.getAlpha() * 100) / 100f).append(" eff=")
                              .append(Math.round(effAlpha(v) * 100) / 100f).append(" vis=").append(v.getVisibility())
                              .append(" onscreen=").append(on).append('\n');
                  } else if (v instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) v;
                      for (int i = 0; i < g.getChildCount(); i++) dumpKeys(root, g.getChildAt(i), keyCls, sb);
                  }
              }

              private static String firstText(View v) {
                  if (v instanceof android.widget.TextView) {
                      CharSequence t = ((android.widget.TextView) v).getText();
                      return t == null ? "" : t.toString();
                  }
                  if (v instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) v;
                      for (int i = 0; i < g.getChildCount(); i++) {
                          String s = firstText(g.getChildAt(i));
                          if (!s.isEmpty()) return s;
                      }
                  }
                  return "";
              }

              private static String cachedB64 = "";
              private static Bitmap cachedBmp;

              public static synchronized Bitmap bitmap(String b64) {
                  if (b64 == null || b64.isEmpty()) return null;
                  if (b64.equals(cachedB64)) return cachedBmp;
                  try {
                      byte[] raw = Base64.decode(b64, Base64.NO_WRAP);
                      cachedBmp = BitmapFactory.decodeByteArray(raw, 0, raw.length);
                  } catch (Throwable t) {
                      cachedBmp = null;
                  }
                  cachedB64 = b64;
                  return cachedBmp;
              }

              public static float imageWidth(RectF kp, int sizePct) { return kp.width() * sizePct / 100f; }
              public static float imageHeight(float w, Bitmap b) { return w * b.getHeight() / (float) b.getWidth(); }

              /** kp: прямоугольник блока цифр. Центр картинки = доли xP/yP (из 1000) от kp. */
              public static void draw(Canvas c, RectF kp, Bitmap bmp, int sizePct, int rot, int xP, int yP, Paint paint) {
                  float w = imageWidth(kp, sizePct);
                  float h = imageHeight(w, bmp);
                  float cx = kp.left + kp.width() * xP / 1000f;
                  float cy = kp.top + kp.height() * yP / 1000f;
                  c.save();
                  c.translate(cx, cy);
                  c.rotate(rot);
                  c.drawBitmap(bmp, null, new RectF(-w / 2f, -h / 2f, w / 2f, h / 2f), paint);
                  c.restore();
              }

              // ------------------------------------------------------------------ SystemUI side
              private static final WeakHashMap<ViewGroup, Host> HOSTS = new WeakHashMap<>();
              private static volatile int totalDraws;
              private static volatile String attachStatus = "attach ещё не вызывался";
              private static volatile String drawNote = "кадров не было";
              private static volatile int lastW, lastH;       // блок цифр в пикселях (по раскладке, без масштаба кнопок)
              private static volatile int lastKeyW, lastKeyH;  // размер одной кнопки в пикселях

              /** Строка для диагностики в приложении. */
              public static String statusLine() {
                  return attachStatus + "; рисование: " + drawNote
                          + (lastW > 0 ? " (блок цифр " + lastW + "x" + lastH + ", кнопка " + lastKeyW + "x" + lastKeyH + ")" : "")
                          + "; кадров=" + totalDraws;
              }

              /** "ширина,высота блока,ширина,высота кнопки" для калибровки превью в приложении; пусто, если данных нет. */
              public static String geomLine() {
                  return lastW > 0 && lastKeyW > 0 ? lastW + "," + lastH + "," + lastKeyW + "," + lastKeyH : "";
              }

              /** Реальная видимость: произведение alpha всех предков; 0, если кто-то скрыт или вид не в окне. */
              static float effAlpha(View v) {
                  if (!v.isAttachedToWindow()) return 0f;
                  float a = 1f;
                  View cur = v;
                  while (cur != null) {
                      if (cur.getVisibility() != View.VISIBLE) return 0f;
                      a *= cur.getAlpha();
                      ViewParent p = cur.getParent();
                      cur = (p instanceof View) ? (View) p : null;
                  }
                  return a;
              }

              /** Границы блока цифр по раскладке (без scale/translation), чтобы превью в приложении повторило их. */
              private static void measureLayout(ViewGroup root, Class<?> keyCls) {
                  int[] box = {Integer.MAX_VALUE, Integer.MAX_VALUE, Integer.MIN_VALUE, Integer.MIN_VALUE, 0, 0};
                  layoutScan(root, root, keyCls, box);
                  if (box[2] > box[0] && box[3] > box[1]) {
                      lastW = box[2] - box[0];
                      lastH = box[3] - box[1];
                      lastKeyW = box[4];
                      lastKeyH = box[5];
                  }
              }

              private static void layoutScan(ViewGroup root, View v, Class<?> keyCls, int[] box) {
                  if (keyCls.isInstance(v)) {
                      if (v.getVisibility() == View.GONE || v.getWidth() <= 0 || v.getHeight() <= 0) return;
                      int l = 0, t = 0;
                      View cur = v;
                      while (cur != root && cur.getParent() instanceof View) {
                          l += cur.getLeft();
                          t += cur.getTop();
                          cur = (View) cur.getParent();
                      }
                      box[0] = Math.min(box[0], l);
                      box[1] = Math.min(box[1], t);
                      box[2] = Math.max(box[2], l + v.getWidth());
                      box[3] = Math.max(box[3], t + v.getHeight());
                      box[4] = Math.max(box[4], v.getWidth());
                      box[5] = Math.max(box[5], v.getHeight());
                  } else if (v instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) v;
                      for (int i = 0; i < g.getChildCount(); i++) layoutScan(root, g.getChildAt(i), keyCls, box);
                  }
              }

              private static int count(View v, Class<?> keyCls) {
                  if (keyCls.isInstance(v)) return 1;
                  int n = 0;
                  if (v instanceof ViewGroup) {
                      ViewGroup g = (ViewGroup) v;
                      for (int i = 0; i < g.getChildCount(); i++) n += count(g.getChildAt(i), keyCls);
                  }
                  return n;
              }

              /**
               * Вызывать с главного потока. Оверлей вешается на корневой View окна: он рисуется последним,
               * поверх всего, и его не может перекрыть соседний элемент.
               * refresher вызывается из draw не чаще раза в 2,5 с: так новые настройки подхватываются
               * и тогда, когда клавиатура SystemUI создана давно и не пересоздаётся.
               */
              public static void attach(View key, Cfg cfg, Class<?> keyCls, Runnable refresher) {
                  View top = key.getRootView();
                  if (!(top instanceof ViewGroup)) { attachStatus = "нет корневого ViewGroup"; return; }
                  ViewGroup cont = (ViewGroup) top;
                  Host h = HOSTS.get(cont);
                  if (h == null) {
                      h = new Host(cont, keyCls);
                      HOSTS.put(cont, h);
                      cont.getOverlay().add(h);
                      cont.addOnLayoutChangeListener(h);
                  }
                  h.cfg = cfg;
                  h.refresher = refresher;
                  Bitmap b = cfg.ovEnabled ? bitmap(cfg.ovImage) : null;
                  h.bmp = b;
                  measureLayout(cont, keyCls);
                  h.setBounds(0, 0, cont.getWidth(), cont.getHeight());
                  attachStatus = "корень=" + cont.getClass().getSimpleName() + " " + cont.getWidth() + "x" + cont.getHeight()
                          + ", клавиш=" + count(cont, keyCls) + ", включено=" + cfg.ovEnabled
                          + ", картинка=" + (b != null ? b.getWidth() + "x" + b.getHeight()
                                  : (cfg.ovImage.isEmpty() ? "не выбрана" : "не декодируется"));
                  scheduleDump(cont, key, keyCls);
                  h.invalidateSelf();
                  cont.invalidate();
              }

              private static final class Host extends Drawable implements View.OnLayoutChangeListener {
                  final WeakReference<ViewGroup> contRef;
                  final Class<?> keyCls;
                  volatile Cfg cfg;
                  volatile Bitmap bmp;
                  volatile Runnable refresher;
                  private long lastRefresh;
                  private final Paint paint = new Paint(Paint.ANTI_ALIAS_FLAG | Paint.FILTER_BITMAP_FLAG);
                  private final Rect tmp = new Rect();
                  private final Rect uni = new Rect();
                  private boolean any;
                  private float maxA;
                  private int shown, faded, offscreen;
                  private final Rect gvr = new Rect();

                  Host(ViewGroup cont, Class<?> keyCls) {
                      this.contRef = new WeakReference<ViewGroup>(cont);
                      this.keyCls = keyCls;
                  }

                  @Override
                  public void onLayoutChange(View v, int l, int t, int r, int b, int ol, int ot, int or, int ob) {
                      setBounds(0, 0, r - l, b - t);
                  }

                  private void collect(ViewGroup cont, View v) {
                      if (keyCls.isInstance(v)) {
                          float ea = effAlpha(v);
                          if (ea < 0.05f) { faded++; return; }   // кнопки скрыты (экран блокировки, анимация закрытия PIN)
                          // кнопка должна реально быть на экране: не за краем и не обрезана родителем больше чем наполовину
                          if (!v.getGlobalVisibleRect(gvr)
                                  || (long) gvr.width() * gvr.height() * 2L < (long) v.getWidth() * v.getHeight()) {
                              offscreen++;
                              return;
                          }
                          shown++;
                          if (ea > maxA) maxA = ea;
                          tmp.set(0, 0, v.getWidth(), v.getHeight());
                          try { cont.offsetDescendantRectToMyCoords(v, tmp); } catch (Throwable t) { return; }
                          if (!any) { uni.set(tmp); any = true; } else uni.union(tmp);
                      } else if (v instanceof ViewGroup) {
                          ViewGroup g = (ViewGroup) v;
                          for (int i = 0; i < g.getChildCount(); i++) collect(cont, g.getChildAt(i));
                      }
                  }

                  @Override
                  public void draw(Canvas c) {
                      ViewGroup cont = contRef.get();
                      if (cont == null) return;
                      totalDraws++;
                      long now = SystemClock.uptimeMillis();
                      Runnable r = refresher;
                      if (r != null && now - lastRefresh > 2500L) { lastRefresh = now; cont.post(r); }

                      Bitmap b = bmp;
                      Cfg f = cfg;
                      if (b == null || f == null) { drawNote = "нет картинки или выключено"; return; }
                      any = false;
                      maxA = 0f;
                      shown = 0;
                      faded = 0;
                      offscreen = 0;
                      collect(cont, cont);
                      if (!any || uni.isEmpty()) { drawNote = "кнопки-цифры скрыты, картинка не рисуется (прозрачные " + faded + ", вне экрана " + offscreen + ")"; return; }
                      // ползунок «Прозрачность» кнопок не должен гасить картинку: считаем только появление/скрытие клавиатуры
                      float norm = Math.min(1f, maxA / Math.max(0.1f, f.opacity / 100f));
                      drawNote = "рисую (видно кнопок " + shown + ", появление " + Math.round(norm * 100) + "%)";
                      paint.setAlpha(Math.round(255f * norm));
                      PinOverlay.draw(c, new RectF(uni), b, f.ovSize, f.ovRot, f.ovX, f.ovY, paint);
                  }

                  @Override public void setAlpha(int a) {}
                  @Override public void setColorFilter(ColorFilter f) {}
                  @Override public int getOpacity() { return PixelFormat.TRANSLUCENT; }
              }
          }
